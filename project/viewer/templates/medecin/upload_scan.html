{% extends 'viewer/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="gradient-text mb-4"><i class="fas fa-file-import"></i> Uploader un Scan NIfTI</h2>
    <div class="card card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <hr>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-upload"></i> Uploader et Traiter
            </button>
        </form>
    </div>
</div>
{% endblock %}
