{% extends 'base.html' %}

{% block content %}
<h2>Liste des patients</h2>

<form method="get">
    <input type="text" name="q" placeholder="Rechercher par nom, prénom ou CIN" value="{{ query }}">
    <button type="submit">Rechercher</button>
</form>

<table>
    <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>CIN</th>
        <th>Actions</th>
    </tr>
    {% for patient in patients %}
    <tr>
        <td>{{ patient.nom }}</td>
        <td>{{ patient.prenom }}</td>
        <td>{{ patient.cin }}</td>
        <td><a href="{% url 'view_patient_detail' patient.id %}">Voir détails</a></td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">Aucun patient trouvé.</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
