{% extends 'viewer/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="gradient-text"><i class="fas fa-cube"></i> Visualisation du Scan</h2>
        <a href="{% url 'patient_detail' scan.patient.id %}" class="btn btn-glass btn-sm">
            <i class="fas fa-arrow-left"></i> Retour au dossier patient
        </a>
    </div>

    <!-- SECTION DU VISUALISEUR 3D PAPAYA -->
    <div class="card card-body mb-4">
        <h4 class="gradient-text mb-3">Visualiseur 3D Interactif</h4>
        <div id="papaya-viewer" class="papaya" data-params="papayaParams"></div>
    </div>

    <!-- SECTION DE LA GALERIE DE COUPES 2D -->
    <h4 class="gradient-text mb-3">Galerie des Coupes 2D</h4>
    <div class="row">
        {% for coupe in coupes %}
        <div class="col-md-2 col-4 mb-3">
            <div class="card bg-dark text-white">
                <img src="{{ coupe.image.url }}" class="card-img-top" alt="Coupe {{ coupe.numero_coupe }}">
                <div class="card-img-overlay d-flex align-items-start p-1">
                    <span class="badge bg-primary">#{{ coupe.numero_coupe }}</span>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-white-50">Aucune coupe 2D n'a été générée pour ce scan.</p>
        {% endfor %}
    </div>
</div>

<!-- SCRIPT D'INITIALISATION DE PAPAYA -->
<script type="text/javascript">
    var papayaParams = [];
    papayaParams["images"] = ["{{ scan.nifti_file.url }}"];
    papayaParams["smoothDisplay"] = false;
</script>

{% endblock %}
