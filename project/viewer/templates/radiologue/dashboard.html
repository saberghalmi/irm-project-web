{% extends 'viewer/base.html' %}

{% block title %}Radiologue - Tableau de bord{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="gradient-text mb-4"><i class="fas fa-x-ray"></i> Dashboard Radiologue</h2>

    {% if message %}
        <div class="alert alert-success mt-3">{{ message }}</div>
    {% endif %}

    <div class="card card-body mt-4">
        <h4 class="gradient-text mb-3">Ajouter une nouvelle image IRM</h4>
        
        <!-- DÉBUT DU FORMULAIRE CORRIGÉ ET COMPLET -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="patient_id" class="form-label text-white">Sélectionner un Patient :</label>
                <!-- Un menu déroulant est beaucoup plus pratique qu'un champ ID -->
                <select name="patient_id" id="patient_id" class="form-select" required>
                    <option value="" disabled selected>-- Choisissez un patient --</option>
                    {% for p in patients %}
                    <option value="{{ p.id }}">{{ p.prenom }} {{ p.nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- LE CHAMP MANQUANT POUR LA DATE EST AJOUTÉ ICI -->
            <div class="mb-3">
                <label for="exam_date" class="form-label text-white">Date de l'examen :</label>
                <input type="date" class="form-control" name="exam_date" id="exam_date" required>
            </div>

            <div class="mb-3">
                <label for="irm_file" class="form-label text-white">Fichier IRM :</label>
                <input type="file" class="form-control" name="irm_file" id="irm_file" required>
            </div>

            <hr style="border-color: rgba(255, 255, 255, 0.2);">
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-upload"></i> Ajouter l’image
            </button>
        </form>
        <!-- FIN DU FORMULAIRE CORRIGÉ ET COMPLET -->
    </div>
</div>
{% endblock %}
