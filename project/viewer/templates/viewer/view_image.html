{% extends 'viewer/base.html' %}

{% block title %}{{ image.title }}{% endblock %}

{% block content %}
    <h2>{{ image.title }}</h2>
    <p class="text-muted">{{ image.description }}</p>

    {% if image.png_preview %}
        <img src="{{ image.png_preview.url }}" alt="Aperçu" class="img-fluid rounded shadow">
    {% else %}
        <div class="alert alert-danger">Aucun aperçu disponible.</div>
    {% endif %}

    <a href="{% url 'home' %}" class="btn btn-link mt-3">← Retour à l’accueil</a>
{% endblock %}
