{% extends 'viewer/base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="login-container">
            <h2 class="login-title text-center mb-5">Accès à votre espace</h2>
            <form method="POST" class="elegant-form">
                {% csrf_token %}
                <div class="form-group mb-4">
                    <label for="username" class="form-label elegant-label">Identifiant</label>
                    <input type="text" 
                           class="form-control elegant-input" 
                           id="username" 
                           name="username" 
                           placeholder="Saisissez votre identifiant"
                           required>
                </div>
                
                <div class="form-group mb-4">
                    <label for="password" class="form-label elegant-label">Mot de passe</label>
                    <input type="password" 
                           class="form-control elegant-input" 
                           id="password" 
                           name="password" 
                           placeholder="Saisissez votre mot de passe"
                           required>
                </div>
                
                {% if form.errors %}
                    <div class="alert alert-danger elegant-error mb-4">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Les informations de connexion sont incorrectes.
                    </div>
                {% endif %}
                
                <button type="submit" class="btn elegant-btn w-100 mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Se connecter
                </button>
                
                <div class="text-center">
                    <a href="#" class="elegant-link">Mot de passe oublié ?</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.login-container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 3rem 2.5rem;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.login-title {
    color: #2c3e50;
    font-weight: 300;
    font-size: 1.8rem;
    letter-spacing: 1px;
    margin-bottom: 2rem;
}

.elegant-label {
    color: #555;
    font-weight: 500;
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.elegant-input {
    border: none;
    border-bottom: 2px solid #e9ecef;
    border-radius: 0;
    padding: 1rem 0;
    background: transparent;
    font-size: 1.1rem;
    transition: all 0.3s ease;
}

.elegant-input:focus {
    border-bottom: 2px solid #007bff;
    box-shadow: none;
    background: transparent;
}

.elegant-input::placeholder {
    color: #adb5bd;
    font-style: italic;
}

.elegant-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 50px;
    padding: 0.9rem 2rem;
    font-weight: 600;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.elegant-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.elegant-btn:active {
    transform: translateY(0);
}

.elegant-error {
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #ff6b6b, #ee5a52);
    color: white;
    border-left: 4px solid #c92a2a;
}

.elegant-link {
    color: #667eea;
    text-decoration: none;
    font-size: 0.9rem;
    transition: all 0.3s ease;
}

.elegant-link:hover {
    color: #764ba2;
    text-decoration: underline;
}

.form-group {
    position: relative;
}

.elegant-form {
    position: relative;
}

/* Animation subtile pour les labels */
.elegant-label {
    opacity: 0;
    animation: fadeInLabel 0.6s ease forwards;
}

.elegant-label:nth-child(1) { animation-delay: 0.1s; }
.elegant-label:nth-child(2) { animation-delay: 0.2s; }

@keyframes fadeInLabel {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive */
@media (max-width: 768px) {
    .login-container {
        padding: 2rem 1.5rem;
        margin: 1rem;
    }
    
    .login-title {
        font-size: 1.5rem;
    }
}
</style>
{% endblock %}
